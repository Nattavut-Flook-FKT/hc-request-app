name: Deploy to Firebase Hosting

# merge/push เข้า main = deploy prod (ไม่ต้อง deploy จากเครื่องอีก)
# workflow_dispatch = กด deploy เองจากแท็บ Actions ได้ ตอนอยาก re-deploy commit เดิม
on:
  push:
    branches: [main]
  workflow_dispatch:

# กัน 2 job ทับกันถ้า push ติดๆ กัน — ตัวใหม่รอตัวเก่าจบ ไม่ cancel เพราะ deploy ครึ่งทางอันตรายกว่ารอ
concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ponytail: เก็บ .env ทั้งไฟล์เป็น secret เดียว (ENV_FILE) ไม่ตั้งแยก 12 ตัว
      # เพิ่ม/ลบ VITE_* ทีหลังไม่ต้องมาแก้ workflow — แก้ที่ secret ที่เดียว
      - name: Write .env from secret
        run: printf '%s\n' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      # secret ไม่ถูกตั้ง → printf เขียน .env เปล่า → build ผ่านเฉยๆ แต่ bundle ไม่มี Firebase config
      # = CI เขียวแต่ prod เปิดไม่ติด · ตายตรงนี้ดีกว่าไปตายบน prod
      - name: Fail fast ถ้า .env ไม่มีของ
        run: grep -q '^VITE_FIREBASE_API_KEY=.' .env || { echo "::error::secret ENV_FILE ไม่ถูกตั้ง (หรือไม่มี VITE_FIREBASE_API_KEY) — ดู CLAUDE.md §3"; exit 1; }

      - run: npm run build

      # ── Firestore rules ─────────────────────────────────────────────────────
      # เดิม workflow นี้ดัน hosting อย่างเดียว firestore.rules ไม่เคยถูก deploy เลย
      # ไฟล์ใน repo จึงเป็นแค่เอกสาร ต้องมีคนรัน firebase deploy ด้วยมือ ซึ่ง CLAUDE.md ห้าม
      #
      # วางไว้ "ก่อน" hosting เพราะ rules ที่พังมักพังตอน validate (syntax) — ให้ล้มตรงนี้
      # ตอนที่ hosting ยังไม่ถูกแตะ prod จะไม่ค้างครึ่งทางแบบโค้ดใหม่+rules เก่า
      #
      # ⚠️ ตั้งแต่นี้ merge เข้า main = ทับ rules บน prod ด้วย
      #    แก้ firestore.rules = แก้ prod โดยตรง ต้องรอบคอบกว่าแก้ UI
      #    (ตอนเปิดใช้ครั้งแรกเทียบแล้วว่า repo กับ rules ที่ live ตรงกันเป๊ะทุกบรรทัด)

      # firebase-tools อ่าน credential จากไฟล์ ไม่รับ JSON ทาง env ตรงๆ
      # เขียนลง RUNNER_TEMP (นอก workspace) กัน checkout/build เผลอเก็บไปกับ artifact
      - name: Write service account for firebase-tools
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules
        run: npx --yes firebase-tools@14 deploy --only firestore:rules --project hcrequest --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: hcrequest
